<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleria | NOI Monfalcone APS</title>
  <meta name="description" content="Le foto delle attività di NOI Monfalcone: campi, feste, Estate Ragazzi e momenti insieme.">
  <link rel="canonical" href="https://www.noimonfalcone.org/galleria">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="NOI Monfalcone APS">
  <meta property="og:title" content="Galleria | NOI Monfalcone APS">
  <meta property="og:description" content="Le foto delle attività di NOI Monfalcone: campi, feste, Estate Ragazzi e momenti insieme.">
  <meta property="og:url" content="https://www.noimonfalcone.org/galleria">
  <meta property="og:image" content="https://www.noimonfalcone.org/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Foto di gruppo di bambini e animatori all'Estate Ragazzi di NOI Monfalcone">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2F5BEA">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/fonts.css?v=20261122">
  <link rel="stylesheet" href="assets/css/style.css?v=20261122">
  <link rel="stylesheet" href="assets/css/tailwind.css?v=20261122">
</head>
<body data-page="galleria" class="bg-paper font-sans text-ink antialiased">
  <div id="site-header"></div>

  <main id="main">
    <section class="tone-blue scallop">
      <div class="mx-auto max-w-7xl px-5 pb-20 pt-14 lg:px-8 lg:pb-24 lg:pt-20">
        <p class="reveal text-sm font-extrabold uppercase tracking-widest text-sun">Momenti</p>
        <h1 class="reveal mt-4 font-display text-6xl font-extrabold leading-[0.95] tracking-tight sm:text-8xl" data-delay="1"><span class="word">Galleria</span></h1>
        <p class="reveal mt-6 max-w-2xl text-lg text-white/85" data-delay="2">Uno sguardo ai nostri giorni più belli.</p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-5 pt-20 lg:px-8" aria-label="Galleria fotografica">
      <!-- Album (generati dalle sottocartelle di assets/img/gallery) -->
      <div data-gallery-filters class="mb-10 flex flex-wrap gap-3"></div>

      <!-- Mosaico: ogni foto mantiene la sua proporzione originale -->
      <div data-gallery class="masonry"></div>

      <div data-gallery-sentinel class="h-px"></div>
      <div class="mt-12 flex flex-col items-center gap-4">
        <p data-gallery-status class="text-sm font-bold text-ink/60" aria-live="polite"></p>
        <button type="button" data-gallery-more class="btn btn-sun hidden">Mostra altre foto</button>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[70] grid place-items-center bg-ink/95 p-4" role="dialog" aria-modal="true" aria-label="Foto ingrandita">
    <button id="lb-close" type="button" class="btn btn-sun absolute right-4 top-4 !h-12 !w-12 !p-0 text-2xl" aria-label="Chiudi">×</button>
    <button id="lb-prev" type="button" class="btn absolute left-3 top-1/2 !h-12 !w-12 -translate-y-1/2 !p-0 text-2xl" aria-label="Foto precedente">‹</button>
    <button id="lb-next" type="button" class="btn absolute right-3 top-1/2 !h-12 !w-12 -translate-y-1/2 !p-0 text-2xl" aria-label="Foto successiva">›</button>
    <div id="lb-stage" class="flex max-w-full justify-center"></div>
    <p id="lb-count" class="absolute bottom-5 left-1/2 -translate-x-1/2 text-sm font-bold text-paper/80" aria-live="polite"></p>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/data.js?v=20261122"></script>
  <script src="assets/js/gallery.js?v=20261122"></script>
  <script src="assets/js/components.js?v=20261122"></script>
  <script src="assets/js/main.js?v=20261122"></script>
</body>
</html>
